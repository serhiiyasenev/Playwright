name: run tests

on:
  workflow_dispatch:
    inputs:
      testName:
        description: 'Part of the test name to run'
        required: false
        default: ''
      workersCount:
        description: 'Workers Count'
        required: false
        default: '1'

jobs:
  e2e:
    env:
      HOME: /root
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.0
    steps:
    - uses: actions/checkout@v7
    
    - name: Install dependencies
      run: npm ci

    - name: Running e2e tests with optional filter
      env:
        TEST_NAME: ${{ inputs.testName }}
        WORKERS_COUNT: ${{ inputs.workersCount }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! "$WORKERS_COUNT" =~ ^[1-9][0-9]*$ ]] || (( WORKERS_COUNT > 16 )); then
          echo "workersCount must be between 1 and 16" >&2
          exit 1
        fi

        if [[ -n "$TEST_NAME" ]]; then
          echo "Running filtered tests with $WORKERS_COUNT workers"
          npx playwright test --grep "$TEST_NAME" --workers "$WORKERS_COUNT"
        else
          echo "Running all tests with $WORKERS_COUNT workers"
          npx playwright test --workers "$WORKERS_COUNT"
        fi
    
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: e2e-report
        path: playwright-report/
        retention-days: 7
